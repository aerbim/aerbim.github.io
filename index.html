<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AERBIM — презентации</title>
<style>
  :root {
    --bg: #0A1A2C; --card: #0F2740; --card-hover: #14324F;
    --fg: #FFFFFF; --muted: #A5CAE4; --accent: #26AAE1;
  }
  *, *::before, *::after { box-sizing: border-box; }
  /* 1rem = 16px до 1920, дальше растёт с шириной: 2560 → 21px, 3840 → 32px */
  html { font-size: clamp(16px, 0.8334vw, 40px); }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 3rem 1rem;
    min-height: 100vh;
  }
  main { width: min(55rem, 100%); text-align: center; }
  h1 { margin: 0 0 1rem; }
  .logo {
    display: inline-block; background: #FFFFFF; border-radius: .75rem;
    padding: clamp(14px, 3vw, 1.5rem) clamp(18px, 4vw, 2rem);
  }
  .logo img { display: block; width: min(23.75rem, 66vw); height: auto; }
  .lead { margin: 0 0 2.5rem; color: var(--muted); font-size: 1.125rem; }
  .choices {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(16.25rem, 1fr));
    gap: 1.25rem; list-style: none; margin: 0; padding: 0;
  }
  .choices a {
    display: flex; flex-direction: column; justify-content: space-between; gap: 2rem;
    min-height: 11.25rem; padding: 1.75rem; text-align: left;
    background: var(--card); color: var(--fg); text-decoration: none;
    border: 1px solid rgba(165, 202, 228, .25); border-left: .25rem solid var(--accent);
    border-radius: .75rem;
    transition: background-color .2s ease, transform .2s ease, border-color .2s ease;
  }
  .choices a:hover { background: var(--card-hover); border-color: var(--muted); border-left-color: var(--accent); transform: translateY(-.125rem); }
  .choices a:focus-visible { outline: .1875rem solid var(--accent); outline-offset: .1875rem; }
  .choices .name { font-size: clamp(22px, 3vw, 1.75rem); font-weight: 700; line-height: 1.2; }
  .choices .go { color: var(--accent); font-size: 1rem; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) {
    .choices a { transition: none; }
    .choices a:hover { transform: none; }
  }
</style>
</head>
<body>
<main>
  <h1><span class="logo"><img src="logo.png" alt="AERBIM Engineering Systems" width="604" height="129"></span></h1>
  <p class="lead">Выберите направление</p>
  <ul class="choices">
    <li><a href="/bim-design/"><span class="name">Проектирование в&nbsp;BIM</span><span class="go">Открыть презентацию →</span></a></li>
    <li><a href="/bim-monitoring/"><span class="name">BIM Мониторинг</span><span class="go">Открыть презентацию →</span></a></li>
  </ul>
</main>
</body>
</html>
