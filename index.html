<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AERBIM — презентации</title>
<style>
  @font-face { font-family: "IBM Plex Sans"; font-display: swap; font-weight: 400; src: url(fonts/ibm-plex-sans-cyrillic-400-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "IBM Plex Sans"; font-display: swap; font-weight: 400; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: "IBM Plex Sans"; font-display: swap; font-weight: 600; src: url(fonts/ibm-plex-sans-cyrillic-600-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "IBM Plex Sans"; font-display: swap; font-weight: 600; src: url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+FEFF, U+FFFD; }
  @font-face { font-family: "IBM Plex Sans"; font-display: swap; font-weight: 700; src: url(fonts/ibm-plex-sans-cyrillic-700-normal.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "IBM Plex Sans"; font-display: swap; font-weight: 700; src: url(fonts/ibm-plex-sans-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+FEFF, U+FFFD; }
  :root {
    --bg: #F4F6F8; --paper: #FFFFFF; --navy: #102A43;
    --ink-2: #526577; --line: #D9E1E8; --accent: #006DA8;
  }
  *, *::before, *::after { box-sizing: border-box; }
  /* 1rem = 16px до 1920, дальше растёт с шириной: 2560 → 21px, 3840 → 32px */
  html { font-size: clamp(16px, 0.8334vw, 40px); }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--navy);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 3rem 1rem;
    min-height: 100vh;
  }
  main { width: min(55rem, 100%); text-align: center; }
  h1 { margin: 0 0 1.5rem; }
  .logo { display: inline-block; }
  .logo img { display: block; width: min(26.25rem, 72vw); height: auto; }
  .rule { width: 4rem; height: .25rem; margin: 0 auto 1.5rem; background: var(--accent); }
  .lead { margin: 0 0 2.5rem; color: var(--ink-2); font-size: 1.25rem; }
  .choices {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(16.25rem, 1fr));
    gap: 1.25rem; list-style: none; margin: 0; padding: 0;
  }
  .choices a {
    display: flex; flex-direction: column; justify-content: space-between; gap: 2rem;
    min-height: 11.25rem; padding: 1.75rem; text-align: left;
    background: var(--paper); color: var(--navy); text-decoration: none;
    border: 1px solid var(--line); border-left: .25rem solid var(--accent);
    border-radius: .5rem;
    transition: border-color .2s ease;
  }
  .choices a:hover { border-color: var(--ink-2); border-left-color: var(--accent); }
  .choices a:focus-visible { outline: .1875rem solid var(--accent); outline-offset: .1875rem; }
  .choices .name { font-size: clamp(22px, 3vw, 1.75rem); font-weight: 600; line-height: 1.2; }
  .choices .go { color: var(--accent); font-size: 1.05rem; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .choices a { transition: none; } }
</style>
</head>
<body>
<main>
  <h1><span class="logo"><img src="logo.png" alt="AERBIM Engineering Systems" width="604" height="129"></span></h1>
  <div class="rule"></div>
  <p class="lead">Выберите направление</p>
  <ul class="choices">
    <li><a href="/bim-design/"><span class="name">Проектирование в&nbsp;BIM</span><span class="go">Открыть презентацию →</span></a></li>
    <li><a href="/bim-monitoring/"><span class="name">BIM Мониторинг</span><span class="go">Открыть презентацию →</span></a></li>
  </ul>
</main>
</body>
</html>
