<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AerBIM</title>
<style>
  :root { --bg: #0A1A2C; --fg: #FFFFFF; --muted: #A5CAE4; --accent: #26AAE1; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 0 16px; box-sizing: border-box;
  }
  main { text-align: center; }
  h1 { margin: 0 0 12px; font-size: clamp(32px, 6vw, 56px); letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  p { margin: 0; color: var(--muted); font-size: 18px; }
</style>
</head>
<body>
<main>
  <h1>Aer<span>BIM</span></h1>
  <p>Страница готовится</p>
</main>
</body>
</html>
